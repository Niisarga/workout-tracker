<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>💪 Workout Tracker</h1>
            <p class="subtitle">Track your fitness journey</p>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="add-workout">Add Workout</button>
            <button class="tab-btn" data-tab="history">History</button>
        </nav>

        <!-- Dashboard Section -->
        <section id="dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">🏋️</div>
                    <div class="stat-info">
                        <span class="stat-value" id="total-workouts">0</span>
                        <span class="stat-label">Total Workouts</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <span class="stat-value" id="this-week">0</span>
                        <span class="stat-label">This Week</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏱️</div>
                    <div class="stat-info">
                        <span class="stat-value" id="total-time">0</span>
                        <span class="stat-label">Total Hours</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏅</div>
                    <div class="stat-info">
                        <span class="stat-value" id="streak">0</span>
                        <span class="stat-label">Day Streak</span>
                    </div>
                </div>
            </div>

            <div class="recent-workouts">
                <h2>Recent Workouts</h2>
                <div id="recent-workouts-list" class="workout-list">
                    <p class="empty-state">No workouts yet. Start your fitness journey!</p>
                </div>
            </div>
        </section>

        <!-- Add Workout Section -->
        <section id="add-workout" class="tab-content">
            <form id="workout-form">
                <div class="form-group">
                    <label for="workout-name">Workout Name</label>
                    <input type="text" id="workout-name" placeholder="e.g., Upper Body, Leg Day, Cardio" required>
                </div>

                <div class="form-group">
                    <label for="workout-date">Date</label>
                    <input type="date" id="workout-date" required>
                </div>

                <div class="form-group">
                    <label for="workout-duration">Duration (minutes)</label>
                    <input type="number" id="workout-duration" placeholder="e.g., 45" min="1" required>
                </div>

                <div class="form-group">
                    <label for="workout-notes">Notes (optional)</label>
                    <textarea id="workout-notes" placeholder="How did the workout feel?" rows="2"></textarea>
                </div>

                <div class="exercises-section">
                    <h3>Exercises</h3>
                    <div id="exercises-container"></div>
                    <button type="button" id="add-exercise-btn" class="btn btn-secondary">+ Add Exercise</button>
                </div>

                <button type="submit" class="btn btn-primary">Save Workout</button>
            </form>
        </section>

        <!-- History Section -->
        <section id="history" class="tab-content">
            <div class="history-header">
                <h2>Workout History</h2>
                <button id="clear-history-btn" class="btn btn-danger btn-small">Clear All</button>
            </div>
            <div id="history-list" class="workout-list">
                <p class="empty-state">No workout history yet.</p>
            </div>
        </section>

        <!-- Workout Detail Modal -->
        <div id="workout-modal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
